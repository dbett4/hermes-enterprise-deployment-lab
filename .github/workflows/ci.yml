name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Matches the version the suite is developed and run against locally.
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt \
                      -r workflow-runner/requirements.txt \
                      -r enterprise-mcp/requirements.txt

      - name: Run unit, contract, and MCP tests
        run: python -m pytest -q

      - name: Run LangGraph Stage-1 proof
        run: |
          set -euo pipefail
          mkdir -p .agent-workflow-proof
          PYTHONPATH=. python scripts/agent-workflow-proof.py | tee .agent-workflow-proof/receipt.json

      - name: FastMCP inspect MCP server
        run: |
          export PYTHONPATH="${PWD}/enterprise-mcp:${PWD}/workflow-runner"
          fastmcp inspect enterprise-mcp/enterprise_mcp/server.py:mcp

      - name: Validate Compose file parses
        # Cheap syntax check. Real container execution lives in the
        # container-proof job below.
        run: python -c "import yaml; yaml.safe_load(open('compose.yaml')); print('compose.yaml parsed')"

      - name: End-to-end demo (separated approval, forced failure, resume, exactly-once)
        run: |
          cp .env.example .env
          PYTHON_BIN=$(which python) ./scripts/demo.sh

      - name: Run live native telemetry proof
        run: PYTHON_BIN=$(which python) ./scripts/telemetry-proof.sh

      - name: Run live native trace proof
        run: PYTHON_BIN=$(which python) ./scripts/trace-proof.sh

      - name: MCP protocol smoke (protocol-only, no Hermes CLI)
        run: |
          export ENTERPRISE_API_TOKEN=lab-read-token
          export ENTERPRISE_API_WRITE_TOKEN=lab-write-token
          PYTHONPATH="${PWD}/enterprise-api" python -m uvicorn app.main:app \
            --app-dir "${PWD}/enterprise-api" --host 127.0.0.1 --port 8080 --log-level warning &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 0.5
          done
          export PYTHONPATH="${PWD}/enterprise-mcp:${PWD}/workflow-runner"
          export ENTERPRISE_API_URL=http://127.0.0.1:8080
          MCP_SMOKE_PROTOCOL_ONLY=1 PYTHON_BIN=$(which python) ./scripts/mcp-smoke.sh

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receipts
          path: |
            .mcp-receipts/mcp-smoke-receipt.json
            .mcp-receipts/fastmcp-protocol.json
            .smoke-receipts/demo-receipt.json
            .audit/demo-audit.jsonl
            .audit/smoke-audit.jsonl
            .telemetry-proof/receipt.json
            .telemetry-proof/api.log
            .telemetry-proof/prometheus.log
            .trace-proof/receipt.json
            .trace-proof/api.log
            .trace-proof/capture.log
            .trace-proof/workflow.log
            .agent-workflow-proof/receipt.json
          include-hidden-files: true
          if-no-files-found: error

  container-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Confirm docker compose engine is usable
        # Fail closed: a CLI-only install without a daemon must not skip this job.
        run: |
          set -euo pipefail
          mkdir -p .container-proof
          {
            docker compose version
            docker info
          } 2>&1 | tee .container-proof/engine-preflight.log

      - name: Install dependencies for demo path
        # Same host install as the test job. Do not pin enterprise-api/requirements.txt
        # here: that older FastAPI pin conflicts with fastmcp's starlette requirement.
        # The API image installs its own requirements inside Compose.
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt \
            -r workflow-runner/requirements.txt \
            -r enterprise-mcp/requirements.txt

      - name: Run container proof
        run: |
          cp .env.example .env
          bash ./scripts/container-proof.sh

      - name: Upload container-proof artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-proof
          path: |
            .container-proof/engine-preflight.log
            .container-proof/receipt.json
            .container-proof/compose-logs.txt
          include-hidden-files: true
          if-no-files-found: error

  cloud-iac-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install cloud contract dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run cloud IaC contracts
        run: python -m pytest -q tests/test_cloud_iac_contract.py

      - name: Run no-apply cloud IaC proof
        run: PYTHON_BIN=$(which python) bash ./scripts/cloud-iac-proof.sh

      - name: Upload cloud IaC proof artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloud-iac-proof
          path: |
            .cloud-iac-proof/receipt.json
            .cloud-iac-proof/commands.log
          include-hidden-files: true
          if-no-files-found: error

  fresh-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Reproduce from a clean clone of this commit
        run: |
          git clone --local . /tmp/fresh-clone
          cd /tmp/fresh-clone
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt \
                                -r workflow-runner/requirements.txt \
                                -r enterprise-mcp/requirements.txt
          .venv/bin/python -m pytest -q
          PYTHONPATH=. .venv/bin/python scripts/agent-workflow-proof.py
          cp .env.example .env
          ./scripts/demo.sh

  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "/tmp/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan pushed or proposed commits for secrets
        # Default rules plus the fixture allowlist in .gitleaks.toml.
        # Scans only the commits this push/PR adds; a new branch scans all history.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ] && ! [[ "${BASE_SHA}" =~ ^0+$ ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            range="${BASE_SHA}..${HEAD_SHA}"
          else
            range="${HEAD_SHA}"
          fi
          echo "gitleaks range: ${range}"
          /tmp/gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts="${range}" .
